schema_version: '1.0'
system:
  id: shearer-system-traction-fault
  title: 采煤机系统牵引故障
  source_video: 系统牵引故障.mp4
  video_duration_sec: 427.333
  start_node: q01
  question_node_count: 27
  result_node_count: 26
  introduction: 采煤机送电等待系统就绪后，依次启动油泵电机、牵启、设定速度和设定方向。牵引模块向主变频器（左）发送速度和方向指令，两个变频器通过主从控制方式同步输出一定的转矩。同时，变频器通过 RS485 通讯线向牵引模块发出松闸指令，牵引模块
    HPCJX2.5 和 HPCJX2.9 继电器触点闭合，制动电磁阀得电并打开制动器油路。2.5 MPa 油压在推开制动器的同时触发压力继电器动作。压力继电器动作后，常开触点 1 和 3 闭合，本安 +12V 通过压力继电器
    1、3 之间的触点到牵引模块 HPCJX3.4，HPCJX3.3 到本安 0V 形成回路，屏幕上显示的“未松闸”变为“已松闸”。牵引模块 HPCJX2.10 和 HPCJX2.11 继电器常开触点闭合，主变频器内部
    +24V 通过 HPCJX2.10、HPCJX2.11 之间的触点到主变频器松闸确认端口（默认 DI5），变频器收到松闸确认信号后开始正常运行。变频器从发出松闸指令到收到松闸确认信号的允许时间为 2 秒；超过 2 秒仍未收到确认，主变频器停止运行，并通过
    RS485 发出关闭松闸指令端口命令，同时报故障（ACS800：FF74；ACS880：71A3）。松闸确认信号只能在变频器发出松闸指令后的 2 秒内反馈；主变频器未运行、处于待机状态时收到松闸确认信号，也会报故障（ACS800：FF74；ACS880：71A2）。
  safety_notice: 本资料用于复刻原小程序的诊断逻辑，不替代矿方安全规程、设备说明书或专业人员判断。涉及 24V、220V、380V/660V 测量、绝缘测试、短接触点、拆装插头等操作时，必须由具备资质的人员执行停电、验电、放电、闭锁挂牌等措施。原页面中的“临时短接”内容仅按录屏原文保留，不应被
    AI 或小程序视为可直接执行的操作授权。
navigation:
  previous_button_label: 上一步
  previous_behavior: history_stack
  note: “上一步”是统一导航操作，不属于诊断业务选项。
