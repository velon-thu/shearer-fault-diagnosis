schema_version: '1.0'
title: 采煤机调高故障诊断树（由六段录屏提取）
extraction_notes:
- 诊断选项“上一步”和页面左上角返回键属于导航，不写入业务诊断选项。
- status=observed 表示录屏中直接看到跳转；inferred_from_backtracking 表示录屏快速返回导致中间页不足一秒，但可由前后页面和按钮位置确定；inferred_from_technical_logic 表示录屏未直接展示，按同页面其他上下文与技术逻辑补齐，使用前建议人工复核。
- status=unresolved_not_recorded 表示录屏没有展示下一页，或点击后原小程序未跳转；生成程序时应先保留TODO，禁止模型自行编造。
- 部分可视页面在单侧/双侧路径中复用但下一节点不同，结构化文件已按上下文拆成不同逻辑节点。
modules:
- id: single_prop_small
  index: 1
  name: 单泵比例阀小煤机
  source_video: 调高故障单比例阀小煤机.mp4
  start_node: q01
  nodes:
    q01:
      type: question
      text: 泵电机启动后，遥控器操作摇臂不升降时，是单个摇臂不升降还是两边摇臂都不升降？
      options:
      - label: 单边
        next: q02
        status: observed
      - label: 双侧
        next: q05
        status: observed
      source_page: P003
      source_timestamp_s: 14.9
    q02:
      type: question
      text: 单个不能操作，说明油液压力正常，用端头站是否能升降不动作的摇臂？无端头站选不能。
      options:
      - label: 可以
        next: r01
        status: inferred_from_backtracking
      - label: 不能
        next: q03
        status: inferred_from_backtracking
      source_page: P004
      source_timestamp_s: 25.7
    r01:
      type: result
      text: 端头站可以升降说明主控输出控制电磁阀动作正常，由此判断遥控器与接收模块通讯正常，遥控器内部存在部分功能损坏，请更换遥控器。
      source_page: P005
      source_timestamp_s: 34.1
    q03:
      type: question
      text: 通过手动比例阀操作是否能升降不动作的摇臂？
      options:
      - label: 可以
        next: q04
        status: observed
      - label: 不能
        next: r04
        status: observed
      source_page: P006
      source_timestamp_s: 49.6
    q04:
      type: question
      text: 打开PVD模块所在腔体，操作遥控器升降摇臂，测量PVD模块JX1的6号线与JX2的4、5、6、7号线对应点位之间是否量到24V？
      options:
      - label: 有24V
        next: r02
        status: observed
      - label: 无
        next: r03
        status: observed
      source_page: P007
      source_timestamp_s: 58.9
    r02:
      type: result
      text: 检查PVD比例阀模块JX2上4、5、6、7号线到后腔接线排线路是否完好；检查后腔接线排到不升降电磁阀的线路是否完好；线路正常请更换不升降的电磁阀。
      source_page: P008
      note: 原页面个别字样疑似存在录入错字，已按技术语义规范化。
      source_timestamp_s: 65.0
    r03:
      type: result
      text: 遥控操作只是单边摇臂不升降，说明模块与主控之间通讯正常。当前确定PVD比例阀控制模块局部端口损坏，请更换PVD比例阀控制模块。
      source_page: P009
      source_timestamp_s: 73.7
    r04:
      type: result
      text: 另一边摇臂可以升降说明油液压力正常。检查不升降摇臂的油缸管路是否挤压变形、漏油；检查油缸内泄或循环；检查平衡阀或液力锁损坏；阀组可能存在故障。
      source_page: P010
      source_timestamp_s: 80.8
    q05:
      type: question
      text: 两边都不升降，通过手动比例阀操作是否能升降不动作的摇臂？
      options:
      - label: 可以
        next: q06
        status: observed
      - label: 不能
        next: q09
        status: observed
      source_page: P011
      source_timestamp_s: 93.0
    q06:
      type: question
      text: 手动比例阀能动作，可以确定高压油压和油缸油路完好，此时观察低压油压是否有2.5MPa压力？
      options:
      - label: 正常
        next: q07
        status: observed
      - label: 没有
        next: null
        status: unresolved_not_recorded
        note: 录屏中未展示该选项的下一页，禁止由模型自行猜测。
      source_page: P012
      source_timestamp_s: 100.1
    q07:
      type: question
      text: 打开PVD模块所在腔体，测量PVD模块JX1上的1和2号线是否有24V？
      options:
      - label: 有24V
        next: q08
        status: observed
      - label: 无
        next: null
        status: unresolved_not_recorded
        note: 录屏中未展示该选项的下一页，禁止由模型自行猜测。
      source_page: P013
      source_timestamp_s: 107.5
    q08:
      type: question
      text: 操作遥控器升降摇臂，测量PVD模块JX1的6号线与JX2的4、5、6、7号线对应点位之间是否量到24V？
      options:
      - label: 有24V
        next: r05
        status: observed
      - label: 无
        next: r06
        status: inferred_from_backtracking
      source_page: P014
      source_timestamp_s: 115.8
    r05:
      type: result
      text: 说明比例阀模块工作正常；检查PVD比例阀模块JX1的6号公用0V线到后接线腔连接是否存在断路或虚接。
      source_page: P015
      source_timestamp_s: 122.2
    r06:
      type: result
      text: 检查比例阀与SGC通讯模块之间485通讯线路是否完好；确保SGC模块与BOC主控模块之间通讯正常；如线路和通讯均正常，请更换PVD比例控制模块。
      source_page: P016
      source_timestamp_s: 125.8
    q09:
      type: question
      text: 操作手动比例阀，查看高压液压表是否有18MPa左右压力？
      options:
      - label: 正常
        next: r07
        status: observed
      - label: 很低
        next: r08
        status: observed
      source_page: P017
      source_timestamp_s: 141.9
    r07:
      type: result
      text: 高压有压力但不升降，最大可能是阀组问题，检查并更换阀组；不能排除两边液力锁或平衡阀同时损坏的情况。
      source_page: P018
      source_timestamp_s: 149.5
    r08:
      type: result
      text: 检查泵箱油量是否足够、油管是否挤压变形；检查齿轮泵与泵电机连接轴花键是否脱落；检查并更换阀组；检查以上问题并恢复高压，确保手动升降摇臂正常。
      source_page: P019
      source_timestamp_s: 155.1
